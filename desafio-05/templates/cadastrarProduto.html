<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Informática</title>
</head>

<body>
    <h1>Loja de Informática</h1>

    <h2>Cadastro de produto:</h2>

    <form action="/cadastrarproduto" method="POST">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Teclado Mecânico" required><br><br>

        <label for="preco">Preço</label>
        <input type="text" id="preco" name="preco" placeholder="Ex.: 149,99" required><br><br>

        <label for="quantidade">Quatidade</label>
        <input type="text" id="quantidade" name="quantidade" placeholder="Ex.: 100" required><br><br>

        <label for="decricao">Descrição</label>
        <textarea name="descricao" id="descricao" placeholder="Ex.: Teclado Logitech G100"required></textarea><br><br>

        <button type="submit">Salvar</button>

    </form>

</body>

</html>
