<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
      }
      .login-card {
        background: #ffffff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 400px;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 1.5rem;
        font-size: 1.6rem;
        color: #333;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #555;
        font-size: 0.95rem;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 0.85rem 1rem;
        margin-bottom: 1rem;
        border: 1px solid #d7dde6;
        border-radius: 8px;
        font-size: 1rem;
        color: #333;
      }
      button {
        width: 100%;
        padding: 0.95rem 1rem;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      .note {
        margin-top: 1rem;
        color: #777;
        font-size: 0.9rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Entrar</h1>   
      <form method="post" action="/login">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>

    <button type="submit">Entrar</button>
      </form>
      <p class="note">Use qualquer usuário/senha se seu backend ainda não estiver configurado.</p>
    </div>
  </body>
</html>
