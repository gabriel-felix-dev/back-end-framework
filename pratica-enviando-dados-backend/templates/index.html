<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 50px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        input,
        button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e0e0e0;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cadastro Produto</h1>
        <form action="/addprodutos" method="POST">
            <input type="text" name="nomeproduto" id="nomeproduto" placeholder="Digite o nome do produto" required>
            <button type="submit">Salvar</button>
        </form>
        <h2>Lista de Produtos</h2>
        {% if produtos %}
        <ul>
            {% for produto in produtos %}
            <li>
                {{ produto }}
                <form action="/updateprodutos" method="POST" style="display: inline;">
                    <input type="hidden" name="nomeanterior" value="{{ produto }}">
                    <input type="text" name="nomenovo" placeholder="Novo nome" required>
                    <button type="submit">Atualizar</button>
                </form>
                <form action="/deleteprodutos" method="POST" style="display: inline;">
                    <input type="hidden" name="nomeproduto" value="{{ produto }}">
                    <button type="submit">Deletar</button>
                </form>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p>Nenhum produto cadastrado...</p>
        {% endif %}
    </div>
</body>

</html>
